<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片放大檢視"><div class="light-head"><span class="light-title" id="light-title">湖內三層雲</span><span class="light-counter" id="light-count"></span><button class="icon-button light-close" id="close" aria-label="關閉相片"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div><div class="light-main"><img id="light-img" alt=""><div class="light-nav"><button class="icon-button prev" id="prev" aria-label="上一張"><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></svg></button><button class="icon-button next" id="next" aria-label="下一張"><svg viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></svg></button></div></div><div class="light-caption" id="light-caption"></div></div>
<script>
/* 與首頁一致：手機向下捲動隱藏 Top Bar，向上捲動恢復。 */
(function(){
 'use strict';
 const topBar=document.querySelector('.site-top-bar');
 let lastScrollY=window.scrollY;
 let ticking=false;
 function updateMobileTopBar(){
  if(!topBar||window.innerWidth>700){
   if(topBar)topBar.classList.remove('is-hidden');
   lastScrollY=window.scrollY;
   ticking=false;
   return;
  }
  const currentScrollY=window.scrollY;
  const delta=currentScrollY-lastScrollY;
  if(currentScrollY<=8)topBar.classList.remove('is-hidden');
  else if(delta>6)topBar.classList.add('is-hidden');
  else if(delta< -6)topBar.classList.remove('is-hidden');
  lastScrollY=currentScrollY;
  ticking=false;
 }
 window.addEventListener('scroll',function(){
  if(!ticking){window.requestAnimationFrame(updateMobileTopBar);ticking=true;}
 },{passive:true});
 window.addEventListener('resize',function(){
  if(window.innerWidth>700&&topBar)topBar.classList.remove('is-hidden');
  lastScrollY=window.scrollY;
 });
})();
/* 縮圖優先：images/thumbs/同檔名，若不存在則退回 images/原圖。
   點開大圖永遠使用 images/原圖。
   沿用原網站既有圖片命名。設施類：第1張 base.jpg，第2張起 base-2.jpg。
   房型類：第1張 room-1f-1.jpg，後續 room-1f-2.jpg ...。
   「其他相片」採 images/other-1.jpg、other-2.jpg ...，連續編號即可。 */
const groups=[
 {title:'客廳',base:'living-room',count:3,unsuffixed:true,desc:'寬敞的公共空間，與親友自在相聚。'},
 {title:'廚房',base:'kitchen',count:6,unsuffixed:true,desc:'中島備餐區與各式便利廚房設備。'},
 {title:'車庫',base:'parking-garage',count:1,unsuffixed:true,desc:'專屬停車空間。'},
 {title:'親子遊戲區',base:'kids-playroom',count:3,unsuffixed:true,desc:'親子同樂的遊戲空間。'},
 {title:'1F四人房',base:'room-1f',count:6,desc:'兩張雙人床，附獨立衛浴。'},
 {title:'2F四人房',base:'room-2f',count:6,desc:'一張雙人床與兩張單人床，附獨立衛浴。'},
 {title:'3F六人房',base:'room-3f',count:6,desc:'六人房，附獨立衛浴。'},
 {title:'烤肉區',base:'bbq-area',count:4,unsuffixed:true,desc:'戶外烤肉與相聚空間。'},
 {title:'交誼室',base:'mahjong-room',count:2,unsuffixed:true,desc:'三樓交誼空間。'},
 {title:'其他相片',base:'other',count:5,auto:true,desc:'更多館內細節與戶外空間。'}
];
const filename=(g,n)=>`images/${g.base}${g.unsuffixed&&n===1?'':'-'+n}.jpg`;
// 縮圖與原圖共用檔名；縮圖不存在時自動改讀原圖。
const thumbnail=(g,n)=>filename(g,n).replace('images/','images/thumbs/');
function setThumbnail(img,original,onOriginalMissing){
 let switched=false;
 img.addEventListener('error',()=>{
  if(!switched){switched=true;img.src=original;}
  else if(onOriginalMissing)onOriginalMissing();
 });
}
const galleries=document.getElementById('galleries'),shortcuts=document.getElementById('shortcuts');
let activePhotos=[],activeIndex=0,lastFocus=null;
const verticals={'親子遊戲區':[1,3],'廚房':[4,6],'2F四人房':[5],'3F六人房':[5],'烤肉區':[1,3,4],'其他相片':[1,3,4,5]};
const isPortrait=(g,n)=>(verticals[g.title]||[]).includes(n);
function makeRow(photos,kind='pair') {const row=document.createElement('div');row.className='photo-row '+kind;photos.forEach(p=>row.append(p));return row;}
function populate(g){
 const node=g.photosNode;node.replaceChildren();
 const nums=Array.from({length:g.count},(_,i)=>i+1);
 node.classList.toggle('kids-layout',g.base==='kids-playroom'&&g.count===3);
 if(!nums.length)return;
 // 其他相片：餐桌橫幅、吊燈與衛浴直式並排、戶外兩張直式並排。
 if(g.base==='other'&&g.count>=5){
  node.classList.add('other-layout');
  node.append(makeRow([tile(g,2)],'other-hero'));
  node.append(makeRow([tile(g,1),tile(g,3)],'other-portraits'));
  node.append(makeRow([tile(g,4),tile(g,5)],'other-portraits'));
  const remaining=nums.filter(n=>n>5);
  while(remaining.length)node.append(makeRow(remaining.splice(0,2).map(n=>tile(g,n)),'pair'));
  return;
 }
 if(g.base==='kids-playroom'&&g.count===3){
  [1,2,3].forEach(n=>node.append(tile(g,n)));
  return;
 }
 // 以清楚易讀的照片組合為優先：用第一張橫圖當主視覺，其餘直圖優先配對。
 const hero=nums.find(n=>!isPortrait(g,n));
 if(hero!==undefined && nums.length>=3){node.append(makeRow([tile(g,hero)],'hero-row'));nums.splice(nums.indexOf(hero),1)}
 const portraits=nums.filter(n=>isPortrait(g,n));const landscapes=nums.filter(n=>!isPortrait(g,n));
 while(portraits.length>=3){node.append(makeRow(portraits.splice(0,3).map(n=>tile(g,n)),'portrait-trio'))}
 while(portraits.length>=2){node.append(makeRow(portraits.splice(0,2).map(n=>tile(g,n)),'portrait-pair'))}
 if(portraits.length){const chosen=[portraits.shift()];if(landscapes.length)chosen.push(landscapes.shift());node.append(makeRow(chosen.map(n=>tile(g,n)),'mixed'))}
 while(landscapes.length){node.append(makeRow(landscapes.splice(0,2).map(n=>tile(g,n)),'pair'))}
}

function tile(g,n){
 const button=document.createElement('button');button.className='photo '+(isPortrait(g,n)?'portrait':'landscape');button.type='button';button.dataset.group=g.title;button.dataset.num=n;button.setAttribute('aria-label',`${g.title}第${n}張照片，點擊放大`);
 const img=document.createElement('img');const original=filename(g,n);img.alt=`湖內三層雲${g.title}第${n}張照片`;img.loading=n===1?'eager':'lazy';img.decoding='async';
 setThumbnail(img,original,()=>{button.dataset.missing='true';button.remove();const shortcut=document.querySelector(`[data-shortcut="${g.base}"]`);if(n===1&&shortcut)shortcut.style.display='none';updateLightboxCount();});
 img.src=thumbnail(g,n);button.append(img);button.addEventListener('click',()=>openLightbox(button));return button
}

function render(){groups.forEach((g,i)=>{const section=document.createElement('section');section.className='group';section.id='space-'+i;const detail=document.createElement('div');detail.className='detail';const heading=document.createElement('h2');heading.textContent=g.title;detail.append(heading);if(g.desc){const p=document.createElement('p');p.textContent=g.desc;detail.append(p)}const photos=document.createElement('div');photos.className='photos';g.photosNode=photos;populate(g);section.append(detail,photos);galleries.append(section);if(i<9){const b=document.createElement('button');b.className='shortcut';b.type='button';b.dataset.shortcut=g.base;const img=document.createElement('img');img.alt='';setThumbnail(img,filename(g,1),()=>b.style.display='none');img.src=thumbnail(g,1);const label=document.createElement('span');label.textContent=g.title;b.append(img,label);b.onclick=()=>section.scrollIntoView({behavior:'smooth',block:'start'});shortcuts.append(b)}})}
render();
/* 靜態網站無法直接列出資料夾；依序檢查 other-1.jpg、other-2.jpg，遇到首張缺檔即停止。
   因此其他相片請使用連續編號，中間不要跳號。最多檢查 100 張。 */
(async()=>{const g=groups.at(-1);for(let n=6;n<=100;n++){const url=filename(g,n);let ok=false;try{const res=await fetch(url,{method:'HEAD'});ok=res.ok&&/^image\//i.test(res.headers.get('content-type')||'image/jpeg')}catch(e){break}if(!ok)break;g.count=n}if(g.count>5)populate(g)})();
const modal=document.getElementById('lightbox');
// iPhone Safari 僅設定 overflow:hidden 仍可能捲動背景；手機改用固定 body 鎖定。
let lightboxScrollState=null;
function lockLightboxBackground(){
 if(lightboxScrollState)return;
 const body=document.body;
 const mobile=window.matchMedia('(max-width: 700px)').matches;
 lightboxScrollState={
  y:window.scrollY,
  mobile,
  overflow:body.style.overflow,
  position:body.style.position,
  top:body.style.top,
  left:body.style.left,
  right:body.style.right,
  width:body.style.width
 };
 body.classList.add('gallery-lightbox-open');
 body.style.overflow='hidden';
 if(mobile){
  body.style.position='fixed';
  body.style.top=`-${lightboxScrollState.y}px`;
  body.style.left='0';
  body.style.right='0';
  body.style.width='100%';
 }
}
function unlockLightboxBackground(){
 if(!lightboxScrollState)return;
 const state=lightboxScrollState;
 lightboxScrollState=null;
 const body=document.body;
 body.style.overflow=state.overflow;
 if(state.mobile){
  body.style.position=state.position;
  body.style.top=state.top;
  body.style.left=state.left;
  body.style.right=state.right;
  body.style.width=state.width;
  // 暫時停用原頁面的平滑捲動，精確返回點開相片前的位置。
  const html=document.documentElement;
  const previousScrollBehavior=html.style.scrollBehavior;
  html.style.scrollBehavior='auto';
  window.scrollTo(0,state.y);
  html.style.scrollBehavior=previousScrollBehavior;
 }
 body.classList.remove('gallery-lightbox-open');
}
function collectPhotos(){return [...document.querySelectorAll('#galleries button.photo:not([data-missing])')];}
function updateLightboxCount(){if(!modal.classList.contains('open'))return;const selected=activePhotos[activeIndex];activePhotos=collectPhotos();const pos=activePhotos.indexOf(selected);activeIndex=pos>=0?pos:Math.min(activeIndex,activePhotos.length-1);if(activePhotos.length)showLightbox();else closeLightbox();}
function openLightbox(source){activePhotos=collectPhotos();activeIndex=activePhotos.indexOf(source);if(activeIndex<0)return;lastFocus=source;lockLightboxBackground();modal.classList.add('open');showLightbox();document.getElementById('close').focus()}
function showLightbox(){const b=activePhotos[activeIndex];if(!b)return;const img=b.querySelector('img');document.getElementById('light-img').src=filename(groups.find(g=>g.title===b.dataset.group),Number(b.dataset.num));document.getElementById('light-img').alt=img.alt;document.getElementById('light-count').textContent=`${activeIndex+1}/${activePhotos.length}`;document.getElementById('light-title').textContent=b.dataset.group;document.getElementById('light-caption').textContent=img.alt}
function move(step){const current=activePhotos[activeIndex];activePhotos=collectPhotos();if(!activePhotos.length)return;const pos=activePhotos.indexOf(current);activeIndex=((pos>=0?pos:activeIndex)+step+activePhotos.length)%activePhotos.length;showLightbox()}
document.getElementById('light-img').addEventListener('error',()=>{const current=activePhotos[activeIndex];if(current){current.dataset.missing='true';current.remove();}activePhotos=collectPhotos();if(activePhotos.length){activeIndex%=activePhotos.length;showLightbox();}else closeLightbox()});
function closeLightbox(){modal.classList.remove('open');unlockLightboxBackground();lastFocus?.focus({preventScroll:true})}
document.getElementById('close').onclick=closeLightbox;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);modal.addEventListener('click',e=>{if(e.target===modal)closeLightbox()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
let touchX=null;document.getElementById('light-img').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});document.getElementById('light-img').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)move(dx<0?1:-1);touchX=null},{passive:true});

</script>
</body></html>
